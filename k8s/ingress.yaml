apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calc-app-ingress
  namespace: student-2401059
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - 2401059.imcc.skilli.in
      secretName: student-app-tls
  rules:
    - host: 2401059.imcc.skilli.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calc-app-service
                port:
                  number: 80
